# 双颗粒度闭环配置：快速路径不调用 API，阈值选择受全精算质量约束。
run:
  seed: 42
  output_root: runs
  database: runs/opc_agent.sqlite3
routing:
  thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.99]
  max_relative_epe_d_degradation: 0.05
  max_refine_rate: 0.20
  ood_zscore: 3.0

workflow:
  validation_outcomes: data/processed/validation_outcomes_v1.json

