[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opc-agent"
version = "0.1.0"
description = "OPC Agent 论文功能复现与双颗粒度闭环"
requires-python = ">=3.8,<3.11"
dependencies = [
  "gymnasium==0.28.1",
  "numpy==1.24.4",
  "openai==1.35.7",
  "opencv-python-headless==4.8.1.78",
  "pydantic==1.10.23",
  "PyYAML==6.0.1",
  "scikit-learn==1.3.2",
  "scipy==1.10.1",
  "stable-baselines3==2.0.0",
]

[project.scripts]
opc-agent = "opc_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

